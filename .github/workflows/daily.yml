name: daily

on:
  schedule:
    - cron: "15 0 * * *" # 08:15（台北）主發
    - cron: "7 13 * * *" # 21:07（台北）補發；今天已發過則無動作
  workflow_dispatch:
    inputs:
      force:
        description: "今天已發過也重發（true = 重發）"
        required: false
      dry_run:
        description: "只抓取並印出，不發送（true = 試跑，不需 secrets）"
        required: false

concurrency:
  group: daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest # 標準 runner；larger runner 即使公開 repo 也會收費，勿改
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch, convert, send
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TELEGRAPH_TOKEN: ${{ secrets.TELEGRAPH_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          FORCE: ${{ inputs.force }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python trendradar_tg.py ${FORCE:+--force} ${DRY_RUN:+--dry-run}

      - name: Commit state
        if: always() # 中途失敗也要把已建好的 Telegraph 頁記錄寫回，避免重跑重建
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "state unchanged"
          else
            git commit -m "chore: update state"
            git pull --rebase
            git push
          fi
